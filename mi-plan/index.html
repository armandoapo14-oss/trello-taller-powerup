<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E6A4E"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mi Plan"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Mi Plan Financiero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna para teléfono, barra de pestañas fija abajo, hojas modales desde abajo */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#14201B; --muted:#5B6A62; --line:#D8E0DB; --soft:#E3EAE5;
  --accent:#0E6A4E; --accent-ink:#FFFFFF; --nec:#2D5B88; --ocio:#A84F73; --aho:#0E6A4E; --gold:#C48A00;
  --ok:#1E8556; --warn:#B87700; --bad:#BC3F2B;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#172019; --ink:#E6EEE9; --muted:#93A39A; --line:#29352F; --soft:#1F2A24;
  --accent:#3DC499; --accent-ink:#06261B; --nec:#86AEDB; --ocio:#E38FB0; --aho:#3DC499; --gold:#E6B53A;
  --ok:#4CC48A; --warn:#E6A83A; --bad:#F07A62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#172019; --ink:#E6EEE9; --muted:#93A39A; --line:#29352F; --soft:#1F2A24;
  --accent:#3DC499; --accent-ink:#06261B; --nec:#86AEDB; --ocio:#E38FB0; --aho:#3DC499; --gold:#E6B53A;
  --ok:#4CC48A; --warn:#E6A83A; --bad:#F07A62; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px 10px}
.brand{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--muted)}
.month span{font-weight:600;font-size:12.5px;min-width:74px;text-align:center;white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px;stroke:var(--ink)}

.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.label{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-weight:800;font-size:18px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-head a,.link{color:var(--accent);font-weight:600;font-size:13.5px;background:none;border:0;padding:0}

.hero{background:var(--ink);color:var(--bg);border:0}
.hero .label{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.hero .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-.02em;margin-top:4px}
.hero .sub{font-size:13px;color:color-mix(in srgb,var(--bg) 75%,transparent);margin-top:4px}
.hero .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.hero .btn.ghost{border-color:color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg)}
.btn.block{width:100%}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5}

.notice{border:1px dashed var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--surface));border-radius:12px;padding:10px 12px;font-size:13.5px}
.notice b{font-weight:700}

.bars{display:flex;flex-direction:column;gap:14px}
.bar-row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar-row .name{font-weight:700;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.bar-row .amt{font-size:13px;color:var(--muted)}
.bar-row .amt b{color:var(--ink);font-weight:700}
.track{height:9px;background:var(--soft);border-radius:99px;margin-top:6px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:99px;transition:width .4s ease}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.mute{background:var(--soft);color:var(--muted)}

.habits{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.habit{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:left;display:flex;gap:8px;align-items:flex-start;font-size:13.5px;font-weight:600;line-height:1.25;min-height:56px}
.habit .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.habit[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.habit[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.habit .box svg{width:12px;height:12px;stroke:var(--accent-ink);opacity:0}
.habit[aria-pressed="true"] .box svg{opacity:1}
.week{display:flex;gap:6px;margin-top:12px;align-items:flex-end}
.week .d{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.week .d i{display:block;height:28px;border-radius:6px;background:var(--soft);margin-bottom:4px;position:relative;overflow:hidden}
.week .d i b{position:absolute;inset:auto 0 0 0;background:var(--accent)}
.week .d.today{color:var(--ink);font-weight:700}

.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:0}
.task .st{border:0;background:none;padding:0;flex:none;margin-top:1px}
.st-ico{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.st-ico.curso{border-color:var(--warn);background:conic-gradient(var(--warn) 0 50%,transparent 50% 100%)}
.st-ico.hecha{border-color:var(--ok);background:var(--ok)}
.st-ico svg{width:12px;height:12px;stroke:#fff}
.task .t{flex:1;min-width:0;cursor:pointer;border-radius:8px}
.task .t:hover .n{text-decoration:underline;text-decoration-color:var(--line)}
.task .t .nota{font-size:12.5px;color:var(--ink);background:var(--soft);border-radius:8px;padding:6px 8px;margin-top:6px;white-space:pre-wrap}
.edit-ico{display:inline-block;width:13px;height:13px;margin-left:4px;vertical-align:-1px;stroke:var(--muted)}
.add-task{margin-top:10px;border:1px dashed var(--line);background:none;border-radius:12px;padding:10px;width:100%;font-weight:700;color:var(--accent)}
.task .t .n{font-weight:600;font-size:14.5px}
.task.hecha .t .n{color:var(--muted);text-decoration:line-through}
.task .t .m{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.phase{display:flex;flex-direction:column}
.phase-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.progress-big{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:8}

.mov-day{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 6px}
.mov{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.mov:first-of-type{border-top:0}
.mov .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;font-family:var(--display)}
.mov .t{flex:1;min-width:0}
.mov .t .n{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .t .m{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .a{font-weight:700;font-size:15px}
.mov .a.in{color:var(--ok)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.tot .v{font-weight:800;font-family:var(--display);font-size:17px;margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:14px}

.sub-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.sub-row:first-of-type{border-top:0}
.sub-row .n{font-weight:600;font-size:14px}
.sub-row .v{font-size:13px;color:var(--muted);text-align:right}
.sub-row .v b{color:var(--ink)}
.sub-row .track{grid-column:1/-1;height:6px;margin-top:2px}

.milestones{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.ms{border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;background:var(--bg)}
.ms .k{font-family:var(--display);font-weight:800;font-size:18px}
.ms .s{font-size:11px;color:var(--muted)}
.ms.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.ms.next{border-color:var(--gold)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:700}
.verdict{border-radius:12px;padding:12px;margin-top:10px;font-size:14px;font-weight:600}
.verdict.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.verdict.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.verdict.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px;min-width:0}
.input.money{font-family:var(--display);font-weight:800;font-size:28px;padding:10px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
a.btn{text-decoration:none}
textarea.input{font-size:14px;resize:vertical;min-height:120px;font-family:var(--body)}
.switch-row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px}
.switch-row>span:first-child{flex:1;min-width:0}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgb(0 0 0 / .2)}
.switch-row[aria-pressed="true"] .switch{background:var(--accent)}
.switch-row[aria-pressed="true"] .switch i{transform:translateX(18px)}
nav.tabs button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:21;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgb(0 0 0 / .22);display:grid;place-items:center}
.fab svg{width:26px;height:26px;stroke:currentColor}
@media (min-width:600px){.fab{right:calc(50% - 280px + 16px)}}

.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 2px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.close{border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(144px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.status{font-size:12px;color:var(--muted);text-align:center;padding:6px 0 0}
.split{display:flex;flex-direction:column;gap:8px}
.split .kv{border-top:1px solid var(--line)}
.meta-row{padding:10px 0;border-top:1px solid var(--line)}
.meta-row:first-child{border-top:0;padding-top:0}
.meta-row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.meta-row .n{font-weight:700}
.meta-row .m{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">

<script>

 {f:"Diagnóstico · semanas 1-2", items:[

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const fmt = n => new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:0}).format(Math.round(n||0));
const pct = n => Math.round((n||0)*100)+"%";
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const todayStr = () => {const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const ymOf = d => d.slice(0,7);
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const monthLabel = ym => {const [y,m]=ym.split("-");return MESES[+m-1].slice(0,3)+" "+y};
const dayLabel = d => {const dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"})};
const shiftMonth = (ym,k)=>{let [y,m]=ym.split("-").map(Number);m+=k;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+pad(m)};
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const blockOf = cat => {for(const k in BLOCKS) if(BLOCKS[k].cats.some(c=>c[0]===cat)) return k; return null};
const ICON = {check:'<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'};
function merge(base,o){ if(!o||typeof o!=="object") return base; for(const k in o){ if(o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k])&&base[k]&&typeof base[k]==="object"&&!Array.isArray(base[k])) base[k]=merge(base[k],o[k]); else base[k]=o[k]; } return base; }

// ---------- Estado ----------
let S = clone(DEF), MOVS = [], tab = "inicio", ym = todayStr();
// ---------- Periodos de cobro ----------
const pD=s=>new Date(s+"T12:00:00");
const pS=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(s,n)=>{ const d=pD(s); d.setDate(d.getDate()+n); return pS(d); };
const dim=(y,m)=>new Date(y,m,0).getDate();
const clampDay=(y,m,day)=>y+"-"+pad(m)+"-"+pad(Math.min(Math.max(1,day),dim(y,m)));
const prevM=(y,m)=>m===1?[y-1,12]:[y,m-1], nextM=(y,m)=>m===12?[y+1,1]:[y,m+1];
function periodRange(s){
  const cf=S.config, per=cf.periodo||"mensual";
  if(per==="semanal"||per==="catorcenal"){ const len=per==="semanal"?7:14, ref=cf.fechaRef||"2026-11-02"; const k=Math.floor(Math.round((pD(s)-pD(ref))/864e5)/len); const start=addDays(ref,k*len); return {start,end:addDays(start,len)}; }
  const [y,m]=s.split("-").map(Number);
  if(per==="quincenal"){ let q1=+cf.q1||15, q2=+cf.q2||30; if(q1>q2){ const t=q1; q1=q2; q2=t; }
    const a=clampDay(y,m,q1), b=clampDay(y,m,q2);
    if(s>=b){ const [ny,nm]=nextM(y,m); return {start:b,end:clampDay(ny,nm,q1)}; }
    if(s>=a) return {start:a,end:b};
    const [py,pm]=prevM(y,m); return {start:clampDay(py,pm,q2),end:a}; }
  const day=+cf.diaMes||1, a=clampDay(y,m,day);
  if(s>=a){ const [ny,nm]=nextM(y,m); return {start:a,end:clampDay(ny,nm,day)}; }
  const [py,pm]=prevM(y,m); return {start:clampDay(py,pm,day),end:a};
}
const shiftPeriod=(s,k)=>{ const P=periodRange(s); return k>0?P.end:addDays(P.start,-1); };
const inPeriod=f=>{ const P=periodRange(ym); return f>=P.start&&f<P.end; };
function periodLabel(s){ const P=periodRange(s);
  if((S.config.periodo||"mensual")==="mensual" && P.start.slice(8)==="01") return monthLabel(P.start.slice(0,7));
  const f=x=>{ const d=pD(x); return d.getDate()+" "+MESES[d.getMonth()].slice(0,3); }; return f(P.start)+" – "+f(addDays(P.end,-1)); }
const PPM={mensual:1,quincenal:2,catorcenal:26/12,semanal:52/12};
const ppm=()=>PPM[S.config.periodo||"mensual"]||1;
const perWord=()=>({mensual:"del mes",quincenal:"de la quincena",catorcenal:"de la catorcena",semanal:"de la semana"})[S.config.periodo||"mensual"];
const perName=()=>({mensual:"mes",quincenal:"quincena",catorcenal:"catorcena",semanal:"semana"})[S.config.periodo||"mensual"];
const mesTxt=m=>m?(/^\d{4}-\d{2}$/.test(m)?monthLabel(m):m):"—";
try{ const t=localStorage.getItem("mpf_tab"); if(t) tab=t; }catch(e){}
let mode = "local", mainRef = null, movsCol = null, saveTimer = null, saving = Promise.resolve(), loadedOnce = false;
let MEMBERS = [], myId = null, myMember = null, membersCol = null, membersLoaded = false, isOwner = false, lastShared = "", shareChain = Promise.resolve();

function setSaveState(t){ $("#saveState").textContent = t; }
function localLoad(){ try{ const s=JSON.parse(localStorage.getItem("mpf_state")||"null"); if(s) S=merge(clone(DEF),s); MOVS=JSON.parse(localStorage.getItem("mpf_movs")||"[]"); }catch(e){} }
function localSave(){ try{ localStorage.setItem("mpf_state",JSON.stringify(S)); localStorage.setItem("mpf_movs",JSON.stringify(MOVS)); }catch(e){} }

function toLocal(){ if(mode!=="db") return; mode="local"; localSave(); setSaveState("Guardado en este teléfono"); }
function saveMain(){
  if(mode!=="db"){ localSave(); return; }
  maybeShare();
  clearTimeout(saveTimer);
  setSaveState("Guardando…");
  saveTimer = setTimeout(()=>{
    saveTimer = null;
    const body = clone(S);
    saving = saving.then(()=>mainRef.set(body)).then(()=>setSaveState("Guardado en tu cuenta"))
      .catch(e=>{ if(e&&e.code==="invalid_argument"){ toLocal(); return; } setSaveState("No se pudo guardar"); toast(e&&e.code==="quota_exceeded"?"Almacenamiento lleno":"No se pudo guardar. Revisa tu conexión."); });
  },500);
}
async function addMov(m){
  m.id = m.id || uid();
  if(mode==="db"){
    MOVS = MOVS.filter(x=>x.id!==m.id).concat([m]); render(); maybeShare();
    try{ await movsCol.doc(m.id).set(m); }catch(e){ if(e&&e.code==="invalid_argument"){ toLocal(); return; } toast("No se guardó el movimiento"); }
  } else { MOVS.push(m); localSave(); render(); }
}
async function delMov(id){
  MOVS = MOVS.filter(x=>x.id!==id); render(); maybeShare();
  if(mode==="db"){ try{ await movsCol.doc(id).delete(); }catch(e){ toast("No se pudo borrar"); } } else localSave();
}

async function init(){
  localLoad(); render();
  const c = window.claude;
  if(!c||!c.use){ setSaveState("Guardado en este teléfono"); return; }
  let db=null, user=null;
  try{ [db,user] = await Promise.all([c.use("db"), c.use("user")]); }catch(e){}
  const id = user ? await user.id() : null;
  if(!db||!id){ setSaveState("Guardado en este teléfono"); return; }
  let cw=null; try{ cw = await user.can("data.write"); }catch(e){}
  if(cw===false){ setSaveState("Guardado en este teléfono"); return; }
  mode="db";
  mainRef = db.doc("data/users/"+id+"/main");
  myId = id; membersCol = db.collection("members");
  try{ isOwner = await user.isOwner(); }catch(e){}
  movsCol = mainRef.collection("movs");
  setSaveState("Conectando…");
  const timer = setTimeout(()=>{ if(!loadedOnce) setSaveState("Sin conexión: los datos pueden no estar al día"); },10000);
  let gotMain=false, gotMovs=false, hadLocal = MOVS.length>0 || JSON.stringify(S)!==JSON.stringify(DEF);
  const localSnapshot = {S:clone(S), MOVS:clone(MOVS)};
  const done = ()=>{ if(gotMain&&gotMovs&&!loadedOnce){ loadedOnce=true; clearTimeout(timer); setSaveState("Guardado en tu cuenta");
      // Migrar lo capturado en este navegador si la cuenta está vacía
      if(hadLocal && !mainExists && MOVS.length===0){ S=merge(clone(DEF),localSnapshot.S); saveMain(); localSnapshot.MOVS.forEach(m=>addMov(m)); toast("Pasé tus datos de este navegador a tu cuenta"); }
      maybeShare();
  }};
  let mainExists=false;
  mainRef.onSnapshot(snap=>{
    if(mode!=="db") return;
    if(snap.metadata.fromCache && !loadedOnce && !snap.exists) return;
    if(!snap.metadata.fromCache) gotMain=true;
    mainExists = mainExists || snap.exists;
    if(saveTimer===null && !snap.metadata.hasPendingWrites){ S = merge(clone(DEF), snap.exists?snap.data():{}); }
    if(!snap.exists) S = loadedOnce?S:clone(DEF);
    done(); render();
  }, e=>{ clearTimeout(timer); setSaveState("No se pudo leer tu información"); });
  movsCol.onSnapshot(snap=>{
    if(mode!=="db") return;
    if(!snap.metadata.fromCache) gotMovs=true;
    MOVS = snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
    done(); render();
  }, e=>{ clearTimeout(timer); setSaveState("No se pudo leer tus movimientos"); });
  membersCol.onSnapshot(snap=>{
    if(mode!=="db") return;
    MEMBERS = snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
    const mine = MEMBERS.find(m=>m.id===myId);
    if(mine){ myMember = {nombre:mine.nombre, compartir:!!mine.compartir, desde:mine.desde}; lastShared = JSON.stringify(memberBody(mine)); }
    if(!snap.metadata.fromCache && !membersLoaded){ membersLoaded = true; if(myMember) maybeShare(); }
    render();
  }, e=>{ membersLoaded = true; render(); });
}

// ---------- Cálculos ----------
function calc(){
  const cf=S.config, PR=periodRange(ym), mes=MOVS.filter(m=>m.fecha>=PR.start&&m.fecha<PR.end);
  const sum = f => mes.filter(f).reduce((a,m)=>a+(+m.monto||0),0);
  const ingReal = sum(m=>m.tipo==="ingreso");
  const nec = sum(m=>m.tipo!=="ingreso"&&blockOf(m.cat)==="nec");
  const ocio = sum(m=>m.tipo!=="ingreso"&&blockOf(m.cat)==="ocio");
  const aho = sum(m=>m.tipo!=="ingreso"&&blockOf(m.cat)==="aho");
  const base = cf.ingreso;
  const metas = {nec:base*cf.pNec/100, ocio:base*cf.pOcio/100, aho:base*cf.pAho/100};
  const bySub = {}; mes.forEach(m=>{ if(m.tipo!=="ingreso") bySub[m.cat]=(bySub[m.cat]||0)+(+m.monto||0); });
  const fondoMov = MOVS.filter(m=>m.cat==="Fondo de emergencia").reduce((a,m)=>a+(+m.monto||0),0);
  const fondo = (+cf.fondoInicial||0) + fondoMov;
  const costo = +cf.costoVida>0 ? +cf.costoVida : metas.nec*ppm();
  const aporteFondo = metas.aho * subP("Fondo de emergencia",60)/100 * ppm();
  return {mes, ingReal, nec, ocio, aho, real:{nec,ocio,aho}, metas, bySub, fondo, costo, cobertura: costo>0?fondo/costo:0, aporteFondo, base};
}
function blockStatus(k, real, meta){
  if(k==="aho"){ if(meta<=0) return ["mute","Sin meta"]; if(real>=meta) return ["ok","Cumplido"]; if(real>0) return ["warn","En camino"]; return ["mute","Pendiente"]; }
  if(meta<=0) return ["mute","Sin meta"];
  const r=real/meta; if(r>1) return ["bad","Excedido"]; if(r>=.85) return ["warn","Cerca del tope"]; return ["ok","Dentro del tope"];
}
function subP(n,def){ const s=S.config.sub; return (s&&s[n]!=null&&s[n]!=="")?+s[n]:def; }
function planItems(){
  const ed=S.planEdits||{};
  const base=PLAN.flatMap(p=>p.items.map(i=>({id:i[0],t:i[1],d:i[2],e:i[3],fase:p.f,custom:false})));
  const cus=(S.planCustom||[]).map(c=>Object.assign({},c,{custom:true}));
  return base.concat(cus).map(i=>Object.assign(i,ed[i.id]||{},{st:S.plan[i.id]||"pendiente"})).filter(i=>!i.hidden);
}

function render(){
  $("#mLabel").textContent = periodLabel(ym);
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current", b.dataset.tab===tab?"page":"false"));
  const v=$("#view"); const c=calc();
  v.innerHTML = ({inicio:vInicio, movs:vMovs, presu:vPresu, fondo:vFondo, plan:vPlan, familia:vFamilia}[tab]||vInicio)(c);
}

function monthCard(){
  const cf=S.config; if((cf.periodo||"mensual")==="mensual" && (+cf.diaMes||1)===1) return "";
  const m=ymOf(ym), mov=MOVS.filter(x=>ymOf(x.fecha)===m), sum=f=>mov.filter(f).reduce((a,x)=>a+(+x.monto||0),0), base=cf.ingreso*ppm();
  const r={nec:sum(x=>x.tipo!=="ingreso"&&blockOf(x.cat)==="nec"), ocio:sum(x=>x.tipo!=="ingreso"&&blockOf(x.cat)==="ocio"), aho:sum(x=>x.tipo!=="ingreso"&&blockOf(x.cat)==="aho"), mNec:base*cf.pNec/100, mOcio:base*cf.pOcio/100, mAho:base*cf.pAho/100};
  return `<section class="card"><div class="sec-head"><h2>Objetivo mensual</h2><span class="hint" style="text-transform:capitalize">${monthLabel(m)}</span></div>
   <div class="hint num" style="margin-bottom:12px">Del 1 al ${dim(+m.slice(0,4),+m.slice(5,7))} · cobrado ${fmt(sum(x=>x.tipo==="ingreso"))} · meta del mes ${fmt(base)} (${ppm().toFixed(1).replace(".0","")} pagos de ${fmt(cf.ingreso)})</div>
   <div class="bars">${miniBars(r)}</div></section>`;
}
function barBlock(k,c,compact){
  const b=BLOCKS[k], real=c.real[k], meta=c.metas[k], [cls,txt]=blockStatus(k,real,meta);
  const w=Math.min(100, meta>0?real/meta*100:0);
  return `<div class="bar-row"><div class="top"><span class="name"><i class="dot" style="background:${b.color}"></i>${b.name}</span><span class="pill ${cls}">${txt}</span></div>
  <div class="track"><div class="fill" style="width:${w}%;background:${cls==="bad"?"var(--bad)":b.color}"></div></div>
  <div class="top" style="margin-top:5px"><span class="amt num"><b>${fmt(real)}</b> de ${fmt(meta)}</span><span class="amt num">${k==="aho"?"faltan ":"quedan "}${fmt(Math.max(0,meta-real))}</span></div></div>`;
}

function vInicio(c){

function taskRow(i){

}

function vMovs(c){
  const list=c.mes.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)||0);
  const ing=c.ingReal, gas=c.nec+c.ocio, aho=c.aho;
  let html=`<div class="totals"><div class="tot"><div class="label">Ingresos</div><div class="v num">${fmt(ing)}</div></div><div class="tot"><div class="label">Gastos</div><div class="v num">${fmt(gas)}</div></div><div class="tot"><div class="label">Ahorro</div><div class="v num">${fmt(aho)}</div></div></div>`;
  if(!list.length) return html+`<section class="card"><div class="empty">Aún no hay movimientos en ${periodLabel(ym)}.<br>Toca <b>+</b> para anotar el primero.</div></section>`+backupCard();
  let cur="", body="";
  list.forEach(m=>{ if(m.fecha!==cur){ if(cur) body+="</section>"; cur=m.fecha; body+=`<section class="card"><div class="mov-day">${dayLabel(m.fecha)}</div>`; }
    const k = m.tipo==="ingreso"?null:blockOf(m.cat); const col = k?BLOCKS[k].color:"var(--ok)";
    body+=`<button class="mov" data-mov="${esc(m.id)}"><span class="ic" style="background:color-mix(in srgb,${col} 16%,transparent);color:${col}">${esc((m.cat||"?")[0])}</span>
     <span class="t"><span class="n" style="display:block">${esc(m.nota||m.cat)}</span><span class="m" style="display:block">${esc(m.cat)} · ${m.tipo==="ingreso"?"Ingreso":k?BLOCKS[k].name:""}</span></span>
     <span class="a num ${m.tipo==="ingreso"?"in":""}">${m.tipo==="ingreso"?"+":"−"}${fmt(m.monto)}</span></button>`; });
  body+="</section>";
  return html+body+backupCard();
}

function vPresu(c){
  const cf=S.config;
  return `<section class="card"><div class="sec-head"><h2>Metas ${perWord()}</h2><button class="link" data-act="cfg">Cambiar %</button></div>

  ["nec","ocio","aho"].map(k=>{ const b=BLOCKS[k], meta=c.metas[k];
    return `<section class="card">${barBlock(k,c)}<div style="margin-top:12px">${b.cats.map(([n,p0])=>{ const p=subP(n,p0), m=meta*p/100, r=c.bySub[n]||0, w=Math.min(100,m>0?r/m*100:0), over=k!=="aho"&&r>m&&m>0;
      return `<div class="sub-row"><span class="n">${n} <span class="hint num">${p}%</span></span><span class="v num"><b>${fmt(r)}</b> / ${fmt(m)}</span><div class="track"><div class="fill" style="width:${w}%;background:${over?"var(--bad)":b.color}"></div></div></div>`;}).join("")}</div><button class="btn ghost block" style="margin-top:12px" data-subedit="${k}">Ajustar % por tema</button></section>`;}).join("")+

}

function vFondo(c){
  const hitos=[1,3,6,12]; const cov=c.cobertura;
  const next=hitos.find(h=>cov<h);
  const falta = next? next*c.costo - c.fondo : 0;
  const mesesNext = next && c.aporteFondo>0 ? Math.ceil(falta/c.aporteFondo) : null;
  const metas=S.metas||[];
  return `<section class="card">
    <div class="label">Fondo de emergencia</div>
    <div style="font-family:var(--display);font-weight:800;font-size:34px;margin-top:2px" class="num">${fmt(c.fondo)}</div>
    <div class="hint num">Cubre <b>${cov.toFixed(1)} meses</b> de un costo de vida de ${fmt(c.costo)}${+S.config.costoVida>0?"":" (meta de Necesidades)"}</div>
    <div class="milestones">${hitos.map(h=>`<div class="ms ${cov>=h?"done":h===next?"next":""}"><div class="k num">${h}</div><div class="s">${h===1?"mes":"meses"}</div><div class="s num">${fmt(h*c.costo)}</div></div>`).join("")}</div>
    <div style="margin-top:12px">
      ${next?`<div class="kv"><span>Siguiente hito</span><b class="num">${next} ${next===1?"mes":"meses"}</b></div>
      <div class="kv"><span>Te falta</span><b class="num">${fmt(falta)}</b></div>
      <div class="kv"><span>Aporte mensual al fondo</span><b class="num">${fmt(c.aporteFondo)}</b></div>
      <div class="kv"><span>Tiempo estimado</span><b class="num">${mesesNext?mesesNext+" meses":"Define tu ahorro"}</b></div>`:`<div class="verdict ok">Llegaste a 12 meses de cobertura.</div>`}
    </div>
    <p class="hint" style="margin:10px 0 0">Meta mínima: ${S.config.mesesObjetivo} meses. El fondo no es para inversiones ni compras: solo para imprevistos.</p>
  </section>
  <section class="card"><h2>¿Puedo hacer este gasto?</h2>
    <p class="hint" style="margin:4px 0 10px">Antes de una compra grande o un proyecto, mira cuánto colchón te quedaría.</p>
    <div class="grid2"><div class="field"><label for="dMonto">Desembolso inicial</label><input class="input num" id="dMonto" inputmode="decimal" placeholder="0"></div>
    <div class="field"><label for="dMensual">Costo mensual extra</label><input class="input num" id="dMensual" inputmode="decimal" placeholder="0"></div></div>
    <div id="dOut"></div></section>
  <section class="card"><div class="sec-head"><h2>Mis metas</h2><button class="link" data-act="meta-new">Agregar</button></div>
    ${metas.length?metas.map((m,i)=>{const p=m.meta>0?Math.min(1,m.acum/m.meta):0;return `<div class="meta-row"><div class="top"><span class="n">${esc(m.nombre)}</span><button class="link" data-meta="${i}">Abonar</button></div>
    <div class="track"><div class="fill" style="width:${p*100}%;background:var(--gold)"></div></div>
    <div class="m num"><span>${fmt(m.acum)} de ${fmt(m.meta)} · ${pct(p)}</span><span>${m.fecha?dayLabel(m.fecha):""}</span></div></div>`}).join(""):`<div class="empty">Agrega metas con monto y fecha: un enganche, una herramienta, un viaje, liquidar una tarjeta.</div>`}
  </section>`;
}
function decision(){
  const out=$("#dOut"); if(!out) return; const c=calc();
  const a=parseFloat(($("#dMonto").value||"").replace(/[^0-9.]/g,""))||0, m=parseFloat(($("#dMensual").value||"").replace(/[^0-9.]/g,""))||0;
  if(!a&&!m){ out.innerHTML=""; return; }
  const resto=c.fondo-a, costo=c.costo+m, cov=costo>0?resto/costo:0;
  const cls = resto<0||cov<1?"bad": cov<S.config.mesesObjetivo?"warn":"ok";
  const msg = resto<0?"No alcanza: tendrías que usar crédito o dinero de otro bloque.": cov<1?"Te quedarías con menos de 1 mes de colchón. Mejor espera.": cov<S.config.mesesObjetivo?`Es posible, pero bajarías de tu meta de ${S.config.mesesObjetivo} meses.`:"Tu colchón lo aguanta.";
  out.innerHTML=`<div style="margin-top:12px"><div class="kv"><span>Fondo restante</span><b class="num">${fmt(resto)}</b></div><div class="kv"><span>Nuevo costo de vida</span><b class="num">${fmt(costo)}</b></div><div class="kv"><span>Cobertura después</span><b class="num">${cov.toFixed(1)} meses</b></div></div><div class="verdict ${cls}">${msg}</div>`;
}

function vPlan(){
  const items=planItems(), done=items.filter(i=>i.st==="hecha").length, p=done/items.length;
  const R=26, C=2*Math.PI*R;
  return `<section class="card progress-big"><svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${R}" stroke="var(--soft)"/><circle cx="32" cy="32" r="${R}" stroke="var(--accent)" stroke-dasharray="${C*p} ${C}" stroke-linecap="round" transform="rotate(-90 32 32)"/></svg>
    <div><div class="label">Plan de 90 días · 2 nov – 31 ene</div><div style="font-family:var(--display);font-weight:800;font-size:24px" class="num">${done} de ${items.length} hechas</div><div class="hint">Toca el círculo para cambiar el estado. Toca el texto para editar la acción.</div></div></section>`+
  PLAN.map((ph,pi)=>{ const its=items.filter(i=>i.fase===ph.f).sort((a,b)=>(a.d||"9").localeCompare(b.d||"9")); const d=its.filter(i=>i.st==="hecha").length;
    return `<section class="card phase"><div class="phase-head"><h2>${ph.f.split(" · ")[0]}</h2><span class="hint num">${ph.f.split(" · ")[1]} · ${d}/${its.length}</span></div>${its.map(taskRow).join("")||`<div class="hint">Sin acciones en esta etapa.</div>`}<button class="add-task" data-addtask="${pi}">+ Agregar acción</button></section>`;}).join("")+
  ((Object.keys(S.planEdits||{}).length||(S.planCustom||[]).length)?`<button class="btn ghost block" data-act="plan-reset">Volver al plan original</button>`:"");
}

// ---------- Familia ----------
function summary(){
  const keep=ym; ym=todayStr(); const c=calc(); const cur=periodLabel(ym); ym=keep;
  const it=planItems(); let hs=0; const now=new Date();
  for(let i=0;i<7;i++){ const d=new Date(now); d.setDate(d.getDate()-i); const ds=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); hs+=(S.habits[ds]||[]).filter(Boolean).length; }
  const r=n=>Math.round(n||0);
  return {mes:cur, ingreso:r(c.ingReal||c.base), nec:r(c.nec), ocio:r(c.ocio), aho:r(c.aho), mNec:r(c.metas.nec), mOcio:r(c.metas.ocio), mAho:r(c.metas.aho), fondo:r(c.fondo), cobertura:Math.round(c.cobertura*10)/10, plan:it.filter(i=>i.st==="hecha").length, planTotal:it.length, habitos:Math.round(hs/28*100)};
}
function memberBody(m){ return {nombre:String(m.nombre||"").slice(0,30), compartir:!!m.compartir, desde:m.desde||todayStr(), resumen:m.compartir?(m.resumen||null):null}; }
function maybeShare(){
  if(mode!=="db"||!membersCol||!myId||!myMember) return;
  const body=memberBody(Object.assign({},myMember,{resumen:myMember.compartir?summary():null}));
  const key=JSON.stringify(body); if(key===lastShared) return; lastShared=key;
  shareChain=shareChain.then(()=>membersCol.doc(myId).set(body)).catch(e=>{ lastShared=""; toast("No se pudo actualizar tu ficha familiar"); });
}
function joinCard(){
  if(mode!=="db"||!membersLoaded||myMember) return "";

   <div style="display:flex;gap:8px"><input class="input" id="joinName" maxlength="30" placeholder="Tu nombre" autocomplete="off"><button class="btn primary" data-act="join">Unirme</button></div></section>`;
}
function miniBars(r){
  return ["nec","ocio","aho"].map(k=>{ const real=r[k]||0, meta=r["m"+k[0].toUpperCase()+k.slice(1)]||0; const [cls,txt]=blockStatus(k,real,meta); const w=Math.min(100,meta>0?real/meta*100:0);
   return `<div class="bar-row"><div class="top"><span class="name" style="font-size:13.5px"><i class="dot" style="background:${BLOCKS[k].color}"></i>${BLOCKS[k].name}</span><span class="pill ${cls}">${txt}</span></div><div class="track"><div class="fill" style="width:${w}%;background:${cls==="bad"?"var(--bad)":BLOCKS[k].color}"></div></div><div class="amt num" style="margin-top:4px">${fmt(real)} de ${fmt(meta)}</div></div>`; }).join("");
}
const CODE_RE=/MIPLAN1:([A-Za-z0-9+/=]+)/;
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s)));
function sumText(){
  if(!S.config.deviceId){ S.config.deviceId=uid(); saveMain(); }
  const r=summary(), n=S.config.nombre;
  const code="MIPLAN1:"+b64e(JSON.stringify({v:1,id:S.config.deviceId,nombre:n,resumen:r}));
  return `Resumen de ${n} · ${mesTxt(r.mes)}\nNecesidades: ${fmt(r.nec)} de ${fmt(r.mNec)}\nOcio: ${fmt(r.ocio)} de ${fmt(r.mOcio)}\nAhorro: ${fmt(r.aho)} de ${fmt(r.mAho)}\nFondo: ${fmt(r.fondo)} (${r.cobertura} meses)\nPlan 90: ${r.plan} de ${r.planTotal} · Hábitos ${r.habitos}%\n\nPara verlo en Mi Plan: copia todo este mensaje y pégalo en Familia → Agregar resumen.\n${code}`;
}

}
function sheetTask(id, phaseIdx){
  const nuevo = id==null; const it = nuevo ? {id:"c"+uid(), t:"", d:"", e:"", nota:"", fase:PLAN[phaseIdx].f, custom:true} : planItems().find(x=>x.id===id);
  if(!it) return;
  let st = nuevo ? "pendiente" : (S.plan[it.id]||"pendiente");
  openSheet(`<div class="sheet-head"><h2>${nuevo?"Nueva acción":"Editar acción"}</h2><button class="close" data-close aria-label="Cerrar">×</button></div>
   <div class="hint">${esc(it.fase)}</div>
   <div class="field"><label for="tkT">Acción</label><input class="input" id="tkT" maxlength="90" value="${esc(it.t)}" placeholder="Qué vas a hacer"></div>
   <div class="grid2"><div class="field"><label for="tkD">Fecha límite</label><input class="input" type="date" id="tkD" value="${esc(it.d||"")}"></div>
   <div class="field"><label for="tkE">Entregable</label><input class="input" id="tkE" maxlength="60" value="${esc(it.e||"")}" placeholder="Cómo sé que quedó"></div></div>
   <div class="field"><label for="tkN">Notas</label><textarea class="input" id="tkN" rows="3" maxlength="300" placeholder="Montos, nombres, pendientes…" style="min-height:80px">${esc(it.nota||"")}</textarea></div>
   <div class="field"><label>Estado</label><div class="seg" id="tkS">${[["pendiente","Pendiente"],["curso","En curso"],["hecha","Hecha"]].map(([k,l])=>`<button data-s="${k}" aria-pressed="${k===st}">${l}</button>`).join("")}</div></div>
   <div class="err" id="tkErr"></div>
   <button class="btn primary block" id="tkSave">${nuevo?"Agregar al plan":"Guardar cambios"}</button>
   ${nuevo?"":`<div id="tkDelZone"><button class="btn ghost block" id="tkDel">${it.custom?"Eliminar acción":"Quitar del plan"}</button></div>`}`, sh=>{
    sh.querySelector("#tkS").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; st=b.dataset.s; sh.querySelectorAll("#tkS button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.s===st)); });
    if(nuevo) setTimeout(()=>sh.querySelector("#tkT").focus(),50);
    sh.querySelector("#tkSave").addEventListener("click",()=>{
      const v={t:sh.querySelector("#tkT").value.trim(), d:sh.querySelector("#tkD").value, e:sh.querySelector("#tkE").value.trim(), nota:sh.querySelector("#tkN").value.trim()};
      if(!v.t){ sh.querySelector("#tkErr").textContent="Escribe qué vas a hacer."; return; }
      if(it.custom){ const list=(S.planCustom||[]).filter(c=>c.id!==it.id); list.push({id:it.id,fase:it.fase,t:v.t,d:v.d,e:v.e,nota:v.nota}); S.planCustom=list; }
      else { S.planEdits=Object.assign({},S.planEdits||{}); S.planEdits[it.id]=Object.assign({},S.planEdits[it.id]||{},v); }
      S.plan[it.id]=st; saveMain(); closeSheet(); render(); toast(nuevo?"Acción agregada":"Acción actualizada");
    });
    const del=sh.querySelector("#tkDel");
    if(del) del.addEventListener("click",()=>{ sh.querySelector("#tkDelZone").innerHTML=`<p class="hint" style="margin:0 0 8px">${it.custom?"Se borra esta acción.":"La acción se oculta. Puedes recuperarla con «Volver al plan original»."}</p><div class="grid2"><button class="btn ghost" data-close>Cancelar</button><button class="btn danger" id="tkDel2">${it.custom?"Eliminar":"Quitar"}</button></div>`;
      sh.querySelector("#tkDel2").addEventListener("click",()=>{ if(it.custom) S.planCustom=(S.planCustom||[]).filter(c=>c.id!==it.id); else { S.planEdits=Object.assign({},S.planEdits||{}); S.planEdits[it.id]=Object.assign({},S.planEdits[it.id]||{},{hidden:true}); } delete S.plan[it.id]; saveMain(); closeSheet(); render(); toast(it.custom?"Acción eliminada":"Acción quitada del plan"); });
    });
  });

function sheetPaste(){

   <button class="btn primary block" id="pasteOk">Agregar</button>`, sh=>{
    sh.querySelector("#pasteOk").addEventListener("click",()=>{

// ---------- Hojas ----------
function openSheet(html, onMount){
  $("#sheetRoot").innerHTML=`<div class="sheet-wrap" id="sw"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  $("#sw").addEventListener("click",e=>{ if(e.target.id==="sw"||e.target.closest("[data-close]")) closeSheet(); });
  onMount&&onMount($("#sw .sheet"));
}
function closeSheet(){ $("#sheetRoot").innerHTML=""; }
function toast(t){ $("#toastRoot").innerHTML=`<div class="toast" role="status">${esc(t)}</div>`; clearTimeout(toast._t); toast._t=setTimeout(()=>$("#toastRoot").innerHTML="",2600); }
const num = v => parseFloat(String(v||"").replace(/[^0-9.]/g,""))||0;

function sheetAdd(preTipo){
  let tipo=preTipo||"gasto", cat=null;
  const catsFor = t => t==="ingreso"?ING_CATS : t==="ahorro"?BLOCKS.aho.cats.map(c=>c[0]) : [...BLOCKS.nec.cats,...BLOCKS.ocio.cats].map(c=>c[0]);
  openSheet(`<div class="sheet-head"><h2>Nuevo movimiento</h2><button class="close" data-close aria-label="Cerrar">×</button></div>
   <div class="seg" id="segTipo">${["gasto","ahorro","ingreso"].map(t=>`<button data-t="${t}" aria-pressed="${t===tipo}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div>
   <div class="field"><label for="aMonto">Monto (MXN)</label><input class="input money num" id="aMonto" inputmode="decimal" placeholder="$0" autocomplete="off"></div>
   <div class="field"><label>Categoría</label><div class="chips" id="aCats"></div></div>
   <div class="grid2"><div class="field"><label for="aFecha">Fecha</label><input class="input" type="date" id="aFecha" value="${todayStr()}"></div>
   <div class="field"><label for="aNota">Nota</label><input class="input" id="aNota" placeholder="Opcional" maxlength="60"></div></div>
   <div class="err" id="aErr"></div>
   <button class="btn primary block" id="aSave">Guardar</button>`, sh=>{
    const paint=()=>{ sh.querySelector("#aCats").innerHTML=catsFor(tipo).map(n=>`<button class="chip" data-c="${esc(n)}" aria-pressed="${n===cat}">${esc(n)}</button>`).join(""); sh.querySelectorAll("#segTipo button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===tipo)); };
    paint();
    sh.querySelector("#segTipo").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tipo=b.dataset.t;cat=null;paint();});
    sh.querySelector("#aCats").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;paint();});
    setTimeout(()=>sh.querySelector("#aMonto").focus(),50);
    sh.querySelector("#aSave").addEventListener("click",()=>{
      const monto=num(sh.querySelector("#aMonto").value), fecha=sh.querySelector("#aFecha").value||todayStr();
      if(!monto){ sh.querySelector("#aErr").textContent="Escribe un monto mayor a cero."; return; }
      if(!cat){ sh.querySelector("#aErr").textContent="Elige una categoría."; return; }
      addMov({fecha,tipo,cat,monto,nota:sh.querySelector("#aNota").value.trim()});
      closeSheet(); if(!inPeriod(fecha)){ ym=fecha; render(); } toast("Movimiento guardado");
    });
  });
}

function sheetCobro(){
  const cf=S.config;
  openSheet(`<div class="sheet-head"><h2>Día de cobro</h2><button class="close" data-close aria-label="Cerrar">×</button></div>
   <p class="hint" style="margin:0">Registra lo que te pagaron y sepárate primero tu ahorro, antes de gastar.</p>
   <div class="field"><label for="cMonto">¿Cuánto recibiste?</label><input class="input money num" id="cMonto" inputmode="decimal" placeholder="$0"></div>
   <div class="grid2"><div class="field"><label for="cFecha">Fecha</label><input class="input" type="date" id="cFecha" value="${todayStr()}"></div>
   <div class="field"><label for="cCat">Tipo</label><select class="input" id="cCat">${ING_CATS.map(n=>`<option>${n}</option>`).join("")}</select></div></div>
   <div class="split" id="cSplit"></div><div class="err" id="cErr"></div>
   <button class="btn primary block" id="cSave">Registrar cobro y separar ahorro</button>
   <button class="btn ghost block" id="cOnly">Solo registrar el cobro</button>`, sh=>{
    const upd=()=>{ const m=num(sh.querySelector("#cMonto").value); const a=m*cf.pAho/100;
      sh.querySelector("#cSplit").innerHTML = m? `<div class="label" style="margin-top:4px">Págate primero · ${cf.pAho}%</div>`+BLOCKS.aho.cats.map(([n,p])=>`<div class="kv"><span>${n}</span><b class="num">${fmt(a*subP(n,p)/100)}</b></div>`).join("")+`<div class="kv"><span>Para necesidades y gustos</span><b class="num">${fmt(m-a)}</b></div>`:""; };
    sh.querySelector("#cMonto").addEventListener("input",upd); setTimeout(()=>sh.querySelector("#cMonto").focus(),50);
    const go=sep=>{ const m=num(sh.querySelector("#cMonto").value), f=sh.querySelector("#cFecha").value||todayStr();
      if(!m){ sh.querySelector("#cErr").textContent="Escribe el monto que recibiste."; return; }
      addMov({fecha:f,tipo:"ingreso",cat:sh.querySelector("#cCat").value,monto:m,nota:"Cobro"});
      if(sep){ const a=m*cf.pAho/100; BLOCKS.aho.cats.forEach(([n,p])=>{ const v=Math.round(a*subP(n,p)/100); if(v>0) addMov({fecha:f,tipo:"ahorro",cat:n,monto:v,nota:"Separado al cobrar"}); }); }
      if(!inPeriod(f)) ym=f;
      closeSheet(); render(); toast(sep?"Cobro registrado y ahorro separado":"Cobro registrado");
    };
    sh.querySelector("#cSave").addEventListener("click",()=>go(true));
    sh.querySelector("#cOnly").addEventListener("click",()=>go(false));
  });
}

function sheetCfg(){
  const cf=S.config;
  openSheet(`<div class="sheet-head"><h2>Ajustes</h2><button class="close" data-close aria-label="Cerrar">×</button></div>
   <div class="field"><label for="sPer">¿Cada cuánto te pagan?</label><select class="input" id="sPer">${[["semanal","Cada semana"],["catorcenal","Cada 14 días (catorcenal)"],["quincenal","Cada quincena"],["mensual","Una vez al mes"]].map(([k,l])=>`<option value="${k}" ${k===(cf.periodo||"mensual")?"selected":""}>${l}</option>`).join("")}</select></div>
   <div class="field" id="fRef"><label for="sRef">Fecha de tu último pago</label><input class="input" type="date" id="sRef" value="${esc(cf.fechaRef||todayStr())}"><span class="hint">Con esta fecha la app calcula tus siguientes pagos.</span></div>
   <div class="grid2" id="fQ"><div class="field"><label for="sQ1">Primer día de pago</label><input class="input num" id="sQ1" inputmode="numeric" value="${cf.q1||15}"></div><div class="field"><label for="sQ2">Segundo día de pago</label><input class="input num" id="sQ2" inputmode="numeric" value="${cf.q2||30}"></div></div>
   <div class="field" id="fDia"><label for="sDia">Día del mes en que te pagan</label><input class="input num" id="sDia" inputmode="numeric" value="${cf.diaMes||1}"><span class="hint">Si es fin de mes pon 30; en meses cortos se toma el último día.</span></div>
   <div class="field"><label for="sIng" id="lIng">Ingreso neto por pago</label><input class="input money num" id="sIng" inputmode="decimal" value="${cf.ingreso}"><span class="hint">Lo que realmente te llega cada vez que cobras, ya con descuentos.</span></div>
   <div class="field"><label>Reparto del ingreso (%)</label><div class="grid3">
     <div class="field"><label for="sNec">Necesidades</label><input class="input num" id="sNec" inputmode="numeric" value="${cf.pNec}"></div>
     <div class="field"><label for="sOcio">Ocio</label><input class="input num" id="sOcio" inputmode="numeric" value="${cf.pOcio}"></div>
     <div class="field"><label for="sAho">Ahorro</label><input class="input num" id="sAho" inputmode="numeric" value="${cf.pAho}"></div></div>
     <span class="hint" id="sSum"></span></div>
   <div class="grid2"><div class="field"><label for="sCosto">Costo de vida mensual</label><input class="input num" id="sCosto" inputmode="decimal" value="${cf.costoVida||""}" placeholder="Auto"><span class="hint">Vacío = meta de Necesidades</span></div>
   <div class="field"><label for="sFondo">Fondo que ya tienes</label><input class="input num" id="sFondo" inputmode="decimal" value="${cf.fondoInicial||""}" placeholder="0"></div></div>
   <div class="field"><label for="sMeses">Meta mínima del fondo (meses)</label><select class="input" id="sMeses">${[3,6,12].map(n=>`<option ${n==cf.mesesObjetivo?"selected":""}>${n}</option>`).join("")}</select></div>
   <div class="err" id="sErr"></div>
   <button class="btn primary block" id="sSave">Guardar ajustes</button>
   <p class="hint" style="margin:0">${mode==="db"?"Tus datos se guardan en tu cuenta de Claude y solo tú los ves; los encuentras igual en el celular y en la computadora.":"Tus datos se guardan solo en este teléfono o navegador. No borres los datos del navegador y descarga tus movimientos de vez en cuando."}</p>`, sh=>{
    const chk=()=>{ const s=num(sh.querySelector("#sNec").value)+num(sh.querySelector("#sOcio").value)+num(sh.querySelector("#sAho").value); sh.querySelector("#sSum").textContent=`Suma: ${s}%`+(s!==100?" · debe dar 100%":" ✓"); return s; };
    ["#sNec","#sOcio","#sAho"].forEach(id=>sh.querySelector(id).addEventListener("input",chk)); chk();
    const perUI=()=>{ const v=sh.querySelector("#sPer").value; sh.querySelector("#fRef").hidden=!(v==="semanal"||v==="catorcenal"); sh.querySelector("#fQ").hidden=v!=="quincenal"; sh.querySelector("#fDia").hidden=v!=="mensual";
      sh.querySelector("#lIng").textContent="Ingreso neto por "+({mensual:"mes",quincenal:"quincena",catorcenal:"catorcena",semanal:"semana"})[v]; };
    sh.querySelector("#sPer").addEventListener("change",perUI); perUI();
    sh.querySelector("#sSave").addEventListener("click",()=>{
      if(chk()!==100){ sh.querySelector("#sErr").textContent="Los tres porcentajes deben sumar 100%."; return; }
      const ing=num(sh.querySelector("#sIng").value); if(!ing){ sh.querySelector("#sErr").textContent="Escribe cuánto te llega por pago."; return; }
      const per=sh.querySelector("#sPer").value, q1=Math.round(num(sh.querySelector("#sQ1").value)), q2=Math.round(num(sh.querySelector("#sQ2").value)), dia=Math.round(num(sh.querySelector("#sDia").value));
      if(per==="quincenal"&&(!q1||!q2||q1>31||q2>31||q1===q2)){ sh.querySelector("#sErr").textContent="Pon dos días de pago distintos, entre 1 y 31."; return; }
      if(per==="mensual"&&(!dia||dia>31)){ sh.querySelector("#sErr").textContent="Pon un día entre 1 y 31."; return; }
      Object.assign(S.config,{periodo:per,fechaRef:sh.querySelector("#sRef").value||todayStr(),q1:q1||15,q2:q2||30,diaMes:dia||1});
      ym=todayStr();
      Object.assign(S.config,{ingreso:ing,pNec:num(sh.querySelector("#sNec").value),pOcio:num(sh.querySelector("#sOcio").value),pAho:num(sh.querySelector("#sAho").value),
        costoVida:num(sh.querySelector("#sCosto").value),fondoInicial:num(sh.querySelector("#sFondo").value),mesesObjetivo:+sh.querySelector("#sMeses").value});
      if(ing!==20000) S.config.ejemplo=false;
      if(!S.plan.p1 && !S.config.ejemplo) S.plan.p1="hecha";
      saveMain(); closeSheet(); render(); toast("Ajustes guardados");
    });
  });
}

function sheetMov(id){
  const m=MOVS.find(x=>x.id===id); if(!m) return;
  openSheet(`<div class="sheet-head"><h2>${esc(m.nota||m.cat)}</h2><button class="close" data-close aria-label="Cerrar">×</button></div>
   <div><div class="kv"><span>Monto</span><b class="num">${fmt(m.monto)}</b></div><div class="kv"><span>Categoría</span><b>${esc(m.cat)}</b></div><div class="kv"><span>Fecha</span><b>${dayLabel(m.fecha)}</b></div></div>
   <div id="delZone"><button class="btn ghost block" id="mDel">Borrar movimiento</button></div>`, sh=>{
    sh.querySelector("#mDel").addEventListener("click",()=>{ sh.querySelector("#delZone").innerHTML=`<p class="hint" style="margin:0 0 8px">¿Seguro? No se puede deshacer.</p><div class="grid2"><button class="btn ghost" data-close>Cancelar</button><button class="btn danger" id="mDel2">Sí, borrar</button></div>`;
      sh.querySelector("#mDel2").addEventListener("click",()=>{ delMov(id); closeSheet(); toast("Movimiento borrado"); }); });
  });
}

function sheetMeta(idx){
  const edit = idx!=null, m = edit? S.metas[idx] : null;
  openSheet(`<div class="sheet-head"><h2>${edit?esc(m.nombre):"Nueva meta"}</h2><button class="close" data-close aria-label="Cerrar">×</button></div>
   ${edit?`<div class="field"><label for="tAbono">¿Cuánto abonas?</label><input class="input money num" id="tAbono" inputmode="decimal" placeholder="$0"></div>
     <div class="kv"><span>Llevas</span><b class="num">${fmt(m.acum)} de ${fmt(m.meta)}</b></div>
     <div class="err" id="tErr"></div><button class="btn primary block" id="tSave">Abonar</button><button class="btn ghost block" id="tDel">Quitar meta</button>`:
   `<div class="field"><label for="tNom">Nombre</label><input class="input" id="tNom" maxlength="40" placeholder="Ej. Liquidar tarjeta"></div>
    <div class="grid2"><div class="field"><label for="tMeta">Monto meta</label><input class="input num" id="tMeta" inputmode="decimal"></div><div class="field"><label for="tFecha">Fecha meta</label><input class="input" type="date" id="tFecha"></div></div>
    <div class="err" id="tErr"></div><button class="btn primary block" id="tSave">Agregar meta</button>`}`, sh=>{
    sh.querySelector("#tSave").addEventListener("click",()=>{
      if(edit){ const a=num(sh.querySelector("#tAbono").value); if(!a){sh.querySelector("#tErr").textContent="Escribe el abono.";return;} S.metas[idx].acum=(+m.acum||0)+a; }
      else { const n=sh.querySelector("#tNom").value.trim(), mm=num(sh.querySelector("#tMeta").value); if(!n||!mm){sh.querySelector("#tErr").textContent="Pon nombre y monto.";return;} S.metas=(S.metas||[]).concat([{nombre:n,meta:mm,acum:0,fecha:sh.querySelector("#tFecha").value||""}]); }
      saveMain(); closeSheet(); render(); toast(edit?"Abono registrado":"Meta agregada");
    });
    if(edit) sh.querySelector("#tDel").addEventListener("click",()=>{ S.metas.splice(idx,1); saveMain(); closeSheet(); render(); });
  });
}

function sheetSub(k){
  const b=BLOCKS[k], meta=calc().metas[k];
  openSheet(`<div class="sheet-head"><h2>${b.name}</h2><button class="close" data-close aria-label="Cerrar">×</button></div>
   <p class="hint" style="margin:0">Reparte el 100% de este bloque (${fmt(meta)} al mes) entre sus temas. Pon 0 en lo que no uses.</p>
   <div>${b.cats.map(([n,p],i)=>`<div class="kv" style="align-items:center"><span><span style="color:var(--ink);font-weight:600">${n}</span><br><small class="num" id="sbm${i}"></small></span><input class="input num" style="width:86px;text-align:right" id="sb${i}" inputmode="numeric" value="${subP(n,p)}" aria-label="% de ${n}"></div>`).join("")}</div>
   <div class="hint num" id="sbSum"></div><div class="err" id="sbErr"></div>
   <button class="btn primary block" id="sbSave">Guardar</button>
   <button class="btn ghost block" id="sbReset">Volver a los valores sugeridos</button>`, sh=>{
    const vals=()=>b.cats.map((_,i)=>num(sh.querySelector("#sb"+i).value));
    const upd=()=>{ const v=vals(), s=Math.round(v.reduce((a,x)=>a+x,0)*100)/100; v.forEach((x,i)=>sh.querySelector("#sbm"+i).textContent=fmt(meta*x/100)+" al mes"); sh.querySelector("#sbSum").textContent=`Suma: ${s}%`+(s===100?" ✓":` · ${s<100?"faltan "+(100-s):"sobran "+(s-100)} ${Math.abs(100-s)===1?"punto":"puntos"}`); return s; };
    sh.addEventListener("input",upd); upd();
    sh.querySelector("#sbSave").addEventListener("click",()=>{ if(upd()!==100){ sh.querySelector("#sbErr").textContent="Los porcentajes deben sumar 100%."; return; }
      const v=vals(); S.config.sub=Object.assign({},S.config.sub||{}); b.cats.forEach(([n],i)=>S.config.sub[n]=v[i]); saveMain(); closeSheet(); render(); toast("Porcentajes guardados"); });
    sh.querySelector("#sbReset").addEventListener("click",()=>{ b.cats.forEach(([n,p],i)=>sh.querySelector("#sb"+i).value=p); upd(); });
  });
}

function backupCard(){
  const u=S.config.ultimoRespaldo;
  return `<section class="card"><h2>Respaldo</h2><p class="hint" style="margin:4px 0 12px">El respaldo completo guarda todo: movimientos, plan de 90 días, hábitos, metas, porcentajes y familia. Guárdalo cada mes (por ejemplo, mándatelo por WhatsApp). Si cambias de teléfono, ábrelo con «Restaurar respaldo».</p>
   <div style="display:flex;flex-direction:column;gap:8px"><button class="btn primary block" data-act="backup">Guardar respaldo completo</button>
   <button class="btn ghost block" data-act="restore">Restaurar respaldo</button>
   <button class="btn ghost block" data-act="export">Descargar movimientos para Excel (CSV)</button></div>
   <p class="hint num" style="margin:10px 0 0">${u?"Último respaldo: "+dayLabel(u):"Todavía no has guardado un respaldo."}</p></section>`;
}
function needsBackup(){
  if(mode==="db"||!MOVS.length) return false;
  const u=S.config.ultimoRespaldo; if(!u) return true;
  return (new Date(todayStr()+"T12:00:00")-new Date(u+"T12:00:00"))/864e5 >= 30;
}
async function saveFile(name,data,mime){
  if(!window.claude||!window.claude.use){ const u=URL.createObjectURL(new Blob([data],{type:mime})); const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); return true; }
  try{ const d=await window.claude.use("downloads"); if(!d){ toast("La descarga no está disponible aquí"); return false; }
    await d.save({filename:name,data}); return true; }catch(e){ if(!(e&&e.code==="declined")) toast("No se pudo descargar"); return false; }
}
async function backupAll(){
  const data=JSON.stringify({app:"mi-plan",v:1,fecha:todayStr(),S,MOVS});
  const ok=await saveFile("mi-plan-respaldo-"+todayStr()+".json",data,"application/json");
  if(ok){ S.config.ultimoRespaldo=todayStr(); saveMain(); render(); toast("Respaldo guardado en tus descargas"); }
}
function pickRestore(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.addEventListener("change",()=>{ const f=inp.files&&inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ let d=null; try{ d=JSON.parse(r.result); }catch(e){}
      if(!d||d.app!=="mi-plan"||!d.S||!Array.isArray(d.MOVS)){ toast("Ese archivo no es un respaldo de Mi Plan"); return; }
      openSheet(`<div class="sheet-head"><h2>Restaurar respaldo</h2><button class="close" data-close aria-label="Cerrar">×</button></div>
       <div><div class="kv"><span>Fecha del respaldo</span><b>${d.fecha?dayLabel(d.fecha):"—"}</b></div><div class="kv"><span>Movimientos</span><b class="num">${d.MOVS.length}</b></div><div class="kv"><span>Acciones del plan hechas</span><b class="num">${Object.values(d.S.plan||{}).filter(x=>x==="hecha").length}</b></div></div>
       <p class="hint" style="margin:0">Esto reemplaza todo lo que hay ahora en este teléfono por lo del respaldo.</p>
       <div class="grid2"><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="rsOk">Restaurar</button></div>`, sh=>{
        sh.querySelector("#rsOk").addEventListener("click",async()=>{
          const old=MOVS.slice(); S=merge(clone(DEF),d.S); if(d.fecha) S.config.ultimoRespaldo=d.fecha; MOVS=d.MOVS.map(m=>Object.assign({},m,{id:m.id||uid()}));
          if(mode==="db"){ saveMain(); const keep=new Set(MOVS.map(m=>m.id)); for(const m of old) if(!keep.has(m.id)){ try{ await movsCol.doc(m.id).delete(); }catch(e){} } for(const m of MOVS){ try{ await movsCol.doc(m.id).set(m); }catch(e){} } }
          else localSave();
          closeSheet(); render(); toast("Respaldo restaurado"); });
      });
    };
    r.readAsText(f); });
  inp.click();
}
async function exportCSV(){
  const rows=[["Fecha","Tipo","Bloque","Categoría","Monto","Nota"]].concat(MOVS.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(m=>[m.fecha,m.tipo,m.tipo==="ingreso"?"Ingreso":(BLOCKS[blockOf(m.cat)]||{}).name||"",m.cat,m.monto,m.nota||""]));
  const csv="﻿"+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  await saveFile("movimientos.csv",csv,"text/csv;charset=utf-8");
}

// ---------- Eventos ----------
document.addEventListener("keydown",e=>{ const ed=e.target.closest&&e.target.closest("[data-edit]"); if(ed&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); sheetTask(ed.dataset.edit); } });
document.addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]"); if(ed&&!ed.closest("#sheetRoot")){ sheetTask(ed.dataset.edit); return; }
  const t=e.target.closest("button"); if(!t||t.closest("#sheetRoot")) return;
  if(t.dataset.addtask!=null){ sheetTask(null,+t.dataset.addtask); return; }
  if(t.dataset.tab){ tab=t.dataset.tab; try{localStorage.setItem("mpf_tab",tab)}catch(_){} render(); window.scrollTo(0,0); return; }
  if(t.dataset.go){ tab=t.dataset.go; try{localStorage.setItem("mpf_tab",tab)}catch(_){} render(); window.scrollTo(0,0); return; }
  if(t.dataset.habit!=null){ const d=todayStr(); const h=(S.habits[d]||[0,0,0,0]).slice(); h[+t.dataset.habit]=h[+t.dataset.habit]?0:1; S.habits[d]=h; saveMain(); render(); return; }
  if(t.dataset.task){ const cyc={pendiente:"curso",curso:"hecha",hecha:"pendiente"}; S.plan[t.dataset.task]=cyc[S.plan[t.dataset.task]||"pendiente"]; saveMain(); render(); return; }
  if(t.dataset.mov){ sheetMov(t.dataset.mov); return; }
  if(t.dataset.meta!=null){ sheetMeta(+t.dataset.meta); return; }
  if(t.dataset.subedit){ sheetSub(t.dataset.subedit); return; }
  if(t.dataset.rmf){ if(t.dataset.armed){ S.familia=Object.assign({},S.familia); delete S.familia[t.dataset.rmf]; saveMain(); render(); } else { t.dataset.armed="1"; t.textContent="¿Quitar? Toca otra vez"; t.style.color="var(--bad)"; } return; }
  if(t.dataset.rm){ if(t.dataset.armed){ membersCol&&membersCol.doc(t.dataset.rm).delete().catch(()=>toast("No se pudo quitar")); } else { t.dataset.armed="1"; t.textContent="¿Quitar? Toca otra vez"; t.style.color="var(--bad)"; } return; }
  const a=t.dataset.act;
  if(a==="send-sum"){ sheetSend(); return; }
  if(a==="plan-reset"){ if(t.dataset.armed){ S.planEdits={}; S.planCustom=[]; saveMain(); render(); toast("Plan original restaurado"); } else { t.dataset.armed="1"; t.textContent="¿Seguro? Se pierden tus cambios al plan. Toca otra vez"; } return; }
  if(a==="backup"){ backupAll(); return; }
  if(a==="restore"){ pickRestore(); return; }
  if(a==="paste-sum"){ sheetPaste(); return; }
  if(a==="join"){ const n=(($("#joinName")||{}).value||"").trim(); if(!n){ toast("Escribe tu nombre"); return; } myMember={nombre:n,compartir:false,desde:todayStr()}; maybeShare(); render(); toast("Ya estás en la familia"); return; }
  if(a==="share"&&myMember){ myMember.compartir=!myMember.compartir; maybeShare(); render(); return; }
  if(a==="rename"&&myMember){ sheetRename(); return; }
  if(a==="add") sheetAdd(); else if(a==="cobro") sheetCobro(); else if(a==="cfg") sheetCfg(); else if(a==="export") exportCSV(); else if(a==="meta-new") sheetMeta(null);
});
document.addEventListener("change",e=>{ if(e.target.id==="famName"){ S.config.nombre=e.target.value.trim().slice(0,30); saveMain(); } });
document.addEventListener("input",e=>{ if(e.target.id==="dMonto"||e.target.id==="dMensual") decision(); });
$("#fab").addEventListener("click",()=>sheetAdd());
$("#openCfg").addEventListener("click",sheetCfg);
$("#mPrev").addEventListener("click",()=>{ym=shiftPeriod(ym,-1);render();});
$("#mNext").addEventListener("click",()=>{ym=shiftPeriod(ym,1);render();});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
init();
})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script></body></html>
